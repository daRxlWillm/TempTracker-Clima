<!DOCTYPE html>
<html lang="es">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Tracker</title>

    <link rel="stylesheet" href="./estilo.css">
    </head>
    <body>
        <div class="contenedor">
            <div class="buscador">
                <input 
                    type="text"
                    placeholder="Ingrese nombre de la ciudad"
                    spellcheck="false"
                    autocomplete="false"
                    id="input-ciudad"
                />
                <button onclick="obtenerClima()">
                    <img src="Imagen/Buscar.png"/>
                </button>
            </div>
            
            <div class="clima-info">
                <p class="clima-info">Parcialmente nublado</p>
                <img src="Imagen/Clima-ejemplo.png" class="clima-icono">
                <h1 class="temp">22°c</h1>
                <h2 class="ciudad">Huancayo</h2>
                <div class="detalles">
                    <div class="col">
                        <img src="Imagen/Humedad.png" />
                        <div>
                            <p class="humedad">50%</p>
                            <p>Humedad</p>
                        </div>
                    </div>

                    <div class="col">
                        <img src="Imagen/Viento.png"/>
                        <div>
                            <p class="Viento">15Km/h</p>
                            <p>Viento</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="codigo.js">        
        </script>
    </body>    
</html>
